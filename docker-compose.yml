services:
  # Hatchet (workflow engine) - dashboard at http://localhost:8080
  hatchet:
    container_name: hatchet
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    ports:
      - "8080:8080" # Web dashboard
      - "7077:7077" # gRPC
    environment:
      - DATABASE_URL=postgres://hatchet:hatchet@hatchet-db:5432/hatchet?sslmode=disable
      - SERVER_AUTH_COOKIE_SECRETS=random-secret-key-min-32-chars-long
      - SERVER_AUTH_COOKIE_INSECURE=true
    depends_on:
      - hatchet-db

  # PostgreSQL for Hatchet
  hatchet-db:
    container_name: hatchet-db
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=hatchet
      - POSTGRES_PASSWORD=hatchet
      - POSTGRES_DB=hatchet
    volumes:
      - hatchet-data:/var/lib/postgresql/data

volumes:
  hatchet-data:
