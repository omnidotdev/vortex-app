<!doctype html>
<meta charset="utf-8">
<title>Vortex OG</title>
<!--
  Vortex OG card (1200x630). Self-contained, regenerable.
  Left brand rail + a builder scene: dot-grid canvas with Webhook -> Transform
  branching to HTTP + Slack, wired by angled connectors. Nodes are FIXED
  width/height so wire endpoints land on the ports:
  out x = node.left + W; in x = node.left; port center y = node.top + H/2.
  Regenerate public/og.png:
    1) serve this dir:  python3 -m http.server 8792
    2) render at exact size:
       chromium --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --virtual-time-budget=5000 --window-size=1200,630 \
         --screenshot=../../public/og.png http://localhost:8792/vortex-og.html
  Brand #795bbf. White logo = vortex-logo-white.png.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: Inter, sans-serif; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: radial-gradient(120% 120% at 78% 20%, #3a2568 0%, #1c1338 48%, #0c0819 100%);
    color: #fff;
  }
  .dots {
    position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(rgba(176,150,255,.16) 1.4px, transparent 1.5px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(88% 90% at 63% 48%, #000 0%, transparent 82%);
            mask-image: radial-gradient(88% 90% at 63% 48%, #000 0%, transparent 82%);
  }
  .glow-a { position:absolute; width:540px; height:540px; border-radius:50%; top:-160px; right:-80px; pointer-events:none;
    background: radial-gradient(circle, rgba(140,96,230,.52) 0%, rgba(140,96,230,0) 68%); filter: blur(6px); }
  .glow-b { position:absolute; width:440px; height:440px; border-radius:50%; bottom:-180px; left:140px; pointer-events:none;
    background: radial-gradient(circle, rgba(90,70,190,.38) 0%, rgba(90,70,190,0) 70%); filter: blur(8px); }
  .frame { position:absolute; inset:20px; border:1.5px solid rgba(176,150,255,.16); border-radius:22px; pointer-events:none; }

  /* left brand rail */
  .rail { position:absolute; left:74px; top:0; bottom:0; width:404px; display:flex; flex-direction:column; justify-content:center; z-index:3; }
  .brandrow { display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .crest { width:74px; height:74px; display:block; filter: drop-shadow(0 6px 22px rgba(140,96,230,.6)); }
  .word { font-weight:800; font-size:64px; letter-spacing:-.035em; }
  .head { font-weight:800; font-size:49px; line-height:1.05; letter-spacing:-.03em; margin-bottom:22px; }
  .head .grad { background:linear-gradient(100deg,#c9b4ff,#8b6cf0); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .pills { display:flex; flex-wrap:wrap; gap:9px; max-width:384px; }
  .pill { font-size:16px; font-weight:600; color:#e7deff; padding:7px 14px; border-radius:999px;
    border:1px solid rgba(176,150,255,.28); background:rgba(140,96,230,.14); }

  /* builder canvas (right). SVG shares the same 0..720 / 0..630 coord space. */
  .canvas { position:absolute; right:0; top:0; width:720px; height:630px; z-index:2; }
  svg.edges { position:absolute; inset:0; width:720px; height:630px; overflow:visible; }
  /* node W=198 H=112 -> port center y = top+56 */
  .node {
    position:absolute; width:198px; height:112px; border-radius:16px; padding:15px 16px; overflow:hidden;
    background: linear-gradient(180deg, rgba(48,34,84,.97), rgba(30,21,56,.97));
    border:1px solid rgba(176,150,255,.32);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .node .top { display:flex; align-items:center; gap:11px; }
  .chip { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .c-trigger { background:linear-gradient(180deg,#f0a84a,#d97a1f); }
  .c-code    { background:linear-gradient(180deg,#7c66f0,#5a3fc0); font-family:"JetBrains Mono",monospace; font-weight:600; font-size:17px; }
  .c-send    { background:linear-gradient(180deg,#3fbf87,#2a9668); }
  .c-http    { background:linear-gradient(180deg,#4aa8f0,#2f7fd0); }
  .n-title { font-weight:700; font-size:16px; letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .n-sub { font-family:"JetBrains Mono",monospace; font-weight:500; font-size:12px; color:#a99ccf; margin-top:12px;
    padding:5px 9px; border-radius:8px; background:rgba(0,0,0,.28); border:1px solid rgba(176,150,255,.12);
    display:inline-block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .port { position:absolute; width:12px; height:12px; border-radius:50%; background:#0c0819; border:2px solid #b096ff; top:50%; transform:translateY(-50%);
    box-shadow: 0 0 8px rgba(176,150,255,.6); }
  .port.in { left:-6px; } .port.out { right:-6px; }

  .credit { position:absolute; left:74px; bottom:40px; display:flex; align-items:center; gap:11px; z-index:3;
    font-size:20px; color:#9c8fc4; font-weight:500; }
  .credit .omni { width:24px; height:24px; opacity:.92; }
  .credit .omni svg { width:100%; height:100%; display:block; }
</style>
<body>
  <div class="card">
    <div class="dots"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <!-- builder canvas. node W=214 H=112 -> port y = top+56, out x = left+214, in x = left -->
    <div class="canvas">
      <svg class="edges" viewBox="0 0 720 630">
        <defs>
          <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8b6cf0" stop-opacity=".95"/>
            <stop offset="1" stop-color="#b096ff" stop-opacity=".95"/>
          </linearGradient>
          <filter id="wireglow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g fill="none" stroke="url(#wire)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#wireglow)">
          <!-- longer horizontal runs (mid-point elbows) give the wires more depth -->
          <!-- Webhook.out(204,146) -> Transform.in(256,321) -->
          <path d="M204,146 H230 V321 H256"/>
          <!-- Transform.out(454,321) -> HTTP.in(502,126) -->
          <path d="M454,321 H474 V126 H494"/>
          <!-- Transform.out(454,321) -> Slack.in(502,516) -->
          <path d="M454,321 H474 V516 H494"/>
        </g>
      </svg>

      <!-- Webhook: left 20, top 90 -->
      <div class="node" style="left:6px; top:90px;">
        <div class="top">
          <div class="chip c-trigger">🛒</div>
          <div class="n-title">New sale</div>
        </div>
        <div class="n-sub">from your store</div>
        <span class="port out"></span>
      </div>

      <!-- Transform: left 250, top 265 -->
      <div class="node" style="left:256px; top:265px;">
        <div class="top">
          <div class="chip c-code">📊</div>
          <div class="n-title">Add to sheet</div>
        </div>
        <div class="n-sub">customers</div>
        <span class="port in"></span><span class="port out"></span>
      </div>

      <!-- HTTP Request: left 480, top 70 -->
      <div class="node" style="left:494px; top:70px;">
        <div class="top">
          <div class="chip c-http">✉️</div>
          <div class="n-title">Email receipt</div>
        </div>
        <div class="n-sub">branded</div>
        <span class="port in"></span>
      </div>

      <!-- Notify Slack: left 480, top 460 -->
      <div class="node" style="left:494px; top:460px;">
        <div class="top">
          <div class="chip c-send">💬</div>
          <div class="n-title">Post to Discord</div>
        </div>
        <div class="n-sub">#sales</div>
        <span class="port in"></span>
      </div>
    </div>

    <!-- brand rail -->
    <div class="rail">
      <div class="brandrow"><img class="crest" src="vortex-logo-white.png" alt="Vortex"><span class="word">Vortex</span></div>
      <div class="head">Automate anything,<br><span class="grad">visually or in code.</span></div>
    </div>

    <div class="credit"><span class="omni"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Omni">
  <path fill="#fff" d="m305.55,251.06c-2.25,39.89-22.63,78.45-54.97,102.2-.02,0-.03.02-.05.03-35.35,24.87-81.6,30.43-121.78,16.38-.35-.12-.7-.25-1.04-.37-26.04-9.8-49.08-27.59-64.36-51.03-.35-.54-.7-1.07-1.03-1.61-.36-.56-.7-1.12-1.04-1.68-.84-1.36-1.63-2.74-2.4-4.14-.38-.69-.78-1.4-1.15-2.11,99.71,81.94,249.46-2.53,229.47-130.45,14.13,22.6,19.75,47.95,18.34,72.79Z"/>
  <path fill="#fff" d="m350.16,291.36c-13.92,38.42-46.39,68.99-85.59,80.61-13.5,4.1-27.59,5.99-41.62,5.63,120.83-45.38,122.54-217.31,1.77-263.96,90.07-3.14,158.73,93.67,125.44,177.72Z"/>
  <path fill="#fff" d="m262.5,264.7c-9.91,16.9-21.83,30.36-35.02,40.65-.02,0-.03.02-.04.02-26.31,19.55-59.7,28.4-92.15,25.76-33.37-3.58-65.28-19.48-87.77-44.61-.03-.02-.05-.05-.08-.09-.53-.65-1.06-1.3-1.59-1.96-18.67-22.2-29.25-50.51-30.41-79.28-.29-11.18.77-22.92,3.39-35.14,3.2-13.74,8.61-26.88,15.94-38.84-21.52,126.87,127.51,214.92,227.72,133.49Z"/>
  <path fill="#fff" d="m175.28,286.51c-24.18-.77-45.05-6.12-62.62-14.81-29.99-16.17-53.17-44.03-64.23-76.15,0,0,0-.02,0-.02-9.94-32.31-7.74-68.25,6.53-98.97,13.75-28.49,38.28-51.08,67.17-63.51,0,0,.02,0,.03-.02,15.92-6.35,34.22-10.1,54.9-10.48-120.82,45.36-122.54,217.31-1.77,263.95Z"/>
  <path fill="#fff" d="m342.25,91.43c-99.69-81.94-249.46,2.54-229.47,130.46-31.13-49.86-20.92-113.06,14.77-154.66.63-.73,1.26-1.45,1.89-2.16,18.88-21.08,44.46-36.24,74.56-40.69,54.31-10.05,112.48,18.21,138.25,67.05Z"/>
  <path fill="#fff" d="m381.15,230.1h0c-3.19,13.74-8.6,26.89-15.94,38.84,21.54-126.89-127.52-214.91-227.71-133.49C214.51,4.1,413.07,81.17,381.15,230.1Z"/>
</svg></span><span>Made by Omni</span></div>
  </div>
</body>
</html>
