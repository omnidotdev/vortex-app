# User queries
query GetCurrentUser {
  currentUser {
    id
    email
    name
    avatar
    isOnboarded
    planType
    theme
    createdAt
    updatedAt
  }
}

query GetUsers {
  users {
    nodes {
      id
      email
      name
      avatar
      planType
      createdAt
    }
  }
}

# Workflow queries
query GetWorkflows($userId: UUID!) {
  workflows(condition: { userId: $userId }) {
    nodes {
      id
      name
      description
      definition
      isActive
      userId
      createdAt
      updatedAt
    }
  }
}

query GetWorkflow($id: UUID!) {
  workflow(id: $id) {
    id
    name
    description
    definition
    isActive
    userId
    createdAt
    updatedAt
    user {
      id
      name
      email
    }
  }
}

query GetWorkflowsByUser($userId: UUID!) {
  user(id: $userId) {
    id
    name
    workflows {
      nodes {
        id
        name
        description
        isActive
        createdAt
        updatedAt
      }
    }
  }
}

# Integration queries
query GetIntegrations($userId: UUID!) {
  integrations(condition: { userId: $userId }) {
    nodes {
      id
      type
      name
      isEnabled
      config
      userId
      createdAt
      updatedAt
    }
  }
}

query GetIntegration($id: UUID!) {
  integration(id: $id) {
    id
    type
    name
    isEnabled
    config
    userId
    createdAt
    updatedAt
    user {
      id
      name
      email
    }
  }
}

query GetIntegrationsByType($userId: UUID!, $type: String!) {
  integrations(condition: { userId: $userId, type: $type }) {
    nodes {
      id
      type
      name
      isEnabled
      config
      createdAt
      updatedAt
    }
  }
}

# Mutations for User
mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    user {
      id
      email
      name
      avatar
      isOnboarded
      planType
      theme
      createdAt
    }
  }
}

mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    user {
      id
      email
      name
      avatar
      isOnboarded
      planType
      theme
      updatedAt
    }
  }
}

mutation DeleteUser($input: DeleteUserInput!) {
  deleteUser(input: $input) {
    user {
      id
    }
  }
}

