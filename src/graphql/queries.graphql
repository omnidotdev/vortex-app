# Complex queries with relationships
query GetUserWithWorkflowsAndIntegrations($userId: UUID!) {
  user(id: $userId) {
    id
    name
    email
    avatar
    planType
    workflows {
      nodes {
        id
        name
        description
        isActive
        createdAt
      }
    }
    integrations {
      nodes {
        id
        type
        name
        isEnabled
        createdAt
      }
    }
  }
}

query GetWorkflowsWithPagination($first: Int, $after: Cursor) {
  workflows(first: $first, after: $after) {
    edges {
      node {
        id
        name
        description
        isActive
        createdAt
        user {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}
