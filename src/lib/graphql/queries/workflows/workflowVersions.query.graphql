query WorkflowVersions($workflowId: UUID!, $first: Int, $offset: Int) {
  workflowVersions(
    condition: { workflowId: $workflowId }
    orderBy: VERSION_DESC
    first: $first
    offset: $offset
  ) {
    nodes {
      rowId
      version
      changeNote
      createdAt
      userByCreatedBy {
        name
        avatarUrl
      }
    }
    totalCount
  }
}
