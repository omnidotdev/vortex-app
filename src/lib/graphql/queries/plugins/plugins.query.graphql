query Plugins($workspaceId: UUID!, $limit: Int) {
  plugins(
    condition: { workspaceId: $workspaceId, isEnabled: true }
    orderBy: NAME_ASC
    first: $limit
  ) {
    nodes {
      rowId
      name
      version
      manifest
      wasmUrl
      isEnabled
      isVerified
      createdAt
      updatedAt
    }
    totalCount
  }
}
