query UserByIdentityProviderId($identityProviderId: UUID!) {
  userByIdentityProviderId(identityProviderId: $identityProviderId) {
    rowId
    email
    name
    avatarUrl
    createdAt
    userOrganizations {
      nodes {
        organizationId
        slug
        name
        type
        role
      }
    }
  }
}
