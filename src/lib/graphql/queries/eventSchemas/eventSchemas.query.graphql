query EventSchemas(
  $first: Int
  $offset: Int
  $orderBy: [EventSchemaOrderBy!]
  $filter: EventSchemaFilter
) {
  eventSchemas: eventSchemata(
    first: $first
    offset: $offset
    orderBy: $orderBy
    filter: $filter
  ) {
    nodes {
      rowId
      name
      source
      description
      payloadSchema
      enforcement
      version
      compatibilityMode
      previousVersionId
      migrationTransform
      createdAt
      updatedAt
    }
    totalCount
  }
}
